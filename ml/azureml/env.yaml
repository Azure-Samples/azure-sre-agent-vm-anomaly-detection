# Conda environment for the Azure ML training job (CPU only, no torch).
# numpy / pandas / scikit-learn are pinned so the pickled model loads in detector/
# (Azure Functions, Python 3.11) - keep detector/requirements.txt on the same versions.
name: vm-anomaly-train
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - pip:
      - numpy==2.4.6
      - scipy==1.17.1
      - pandas==3.0.5
      - scikit-learn==1.9.1
      - joblib==1.6.0
